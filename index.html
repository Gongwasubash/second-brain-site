<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life OS - Subash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0f1a;--bg2:#0f1525;--bg3:#141c2e;--bg4:#1a2540;
--border:#1e2d4a;--border2:#2a3a5c;
--text:#e8edf5;--text2:#8899b8;--text3:#5a6a88;
--accent:#4d7cfe;--accent2:#6b95ff;--accent3:#3a5fd4;
--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--purple:#a78bfa;--pink:#f472b6;
--font:'Inter',system-ui,sans-serif;
--sidebar-w:220px;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font)}
.app{display:flex;height:100vh}

/* Sidebar */
.sb{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s;z-index:100}
.sb-h{padding:16px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.nav{flex:1;padding:8px;overflow-y:auto}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:12px 12px 6px;font-weight:600}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);transition:all .15s}
.ni:hover{background:var(--bg3);color:var(--text)}
.ni.a{background:var(--accent);color:#fff}
.ni i{font-size:16px;width:20px;text-align:center}
.user-card{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;background:var(--accent3);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.user-name{font-size:13px;font-weight:500}
.user-plan{font-size:11px;color:var(--text2)}

/* Main */
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);min-width:0}
.hd{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.sb-wrap{flex:1;max-width:500px;position:relative}
.sb-wrap input{width:100%;padding:9px 14px 9px 36px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.sb-wrap input:focus{border-color:var(--accent)}
.sb-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.ct{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* Panel */
.panel{padding:20px;max-width:900px;margin:0 auto;width:100%}
.panel h2{font-size:18px;font-weight:600;margin-bottom:16px}
.panel h3{font-size:14px;font-weight:600;margin-bottom:8px}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;transition:all .15s}
.card:hover{border-color:var(--accent)}

/* Grid */
.grid{display:grid;gap:12px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

/* Theme callout */
.theme-card{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.theme-card .label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:8px}
.theme-card .text{font-size:16px;font-weight:500;line-height:1.6;color:var(--text)}

/* Memento mori */
.memento{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.memento .big{font-size:32px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.memento .sub{font-size:11px;color:var(--text3);margin-top:4px}
.memento .bar{height:6px;background:var(--bg4);border-radius:3px;margin-top:10px;overflow:hidden}
.memento .bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s}

/* Wheel chart */
.wheel-wrap{display:flex;align-items:center;justify-content:center;padding:16px 0}
.wheel-legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.wheel-legend span{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
.wheel-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Daily questions */
.dq-bar{display:flex;align-items:flex-end;gap:4px;height:100px;padding:8px 0}
.dq-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dq-col .bar{width:100%;border-radius:4px 4px 0 0;transition:height .3s;min-height:2px}
.dq-col .lbl{font-size:9px;color:var(--text3);text-align:center;writing-mode:vertical-rl;transform:rotate(180deg);max-height:60px;overflow:hidden}

/* Habits */
.habit-grid{display:grid;gap:2px}
.habit-cell{width:100%;aspect-ratio:1;border-radius:3px;cursor:pointer;transition:all .15s;border:1px solid transparent}
.habit-cell:hover{border-color:var(--accent)}
.habit-cell.l0{background:var(--bg4)}
.habit-cell.l1{background:rgba(77,124,254,.3)}
.habit-cell.l2{background:rgba(77,124,254,.5)}
.habit-cell.l3{background:rgba(77,124,254,.7)}
.habit-cell.l4{background:var(--accent)}
.habit-labels{display:flex;gap:2px;margin-bottom:4px}
.habit-labels span{flex:1;font-size:9px;color:var(--text3);text-align:center}

/* Journal */
.journal-entry{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.journal-entry h3{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--accent)}
.journal-entry .date{font-size:11px;color:var(--text3);margin-bottom:8px}
.journal-section{margin-bottom:12px}
.journal-section h4{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px}
.journal-section textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);padding:10px;resize:vertical;min-height:60px;outline:none}
.journal-section textarea:focus{border-color:var(--accent)}

/* Questions grid */
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.q-item{background:var(--bg3);border-radius:8px;padding:10px}
.q-item .q-text{font-size:11px;color:var(--text2);margin-bottom:6px;line-height:1.4}
.q-item .q-score{display:flex;gap:4px}
.q-item .q-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--bg4);color:var(--text3);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.q-item .q-btn:hover,.q-item .q-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Habits check */
.h-check{display:flex;gap:8px;flex-wrap:wrap}
.h-check label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;padding:6px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border);transition:all .15s}
.h-check label:hover{border-color:var(--accent)}
.h-check input:checked+span{color:var(--green)}
.h-check input{accent-color:var(--green)}

/* Tasks */
.task-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:6px;border:1px solid var(--border)}
.task-item input{accent-color:var(--green)}
.task-item.done{text-decoration:line-through;opacity:.5}
.task-item .text{flex:1;font-size:13px}
.task-item .date{font-size:10px;color:var(--text3)}
.task-input{display:flex;gap:8px;margin-bottom:12px}
.task-input input{flex:1;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.task-input input:focus{border-color:var(--accent)}
.btn{padding:8px 16px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;font-family:var(--font);transition:background .15s}
.btn:hover{background:var(--accent2)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--bg3)}

/* Kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kanban-col{min-width:250px;flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px}
.kanban-col h4{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.kanban-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;font-size:13px;transition:all .15s}
.kanban-card:hover{border-color:var(--accent)}
.kanban-card .meta{font-size:10px;color:var(--text3);margin-top:4px}

/* People */
.person-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:all .15s}
.person-card:hover{border-color:var(--accent)}
.person-card .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent3);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
.person-card .name{font-size:14px;font-weight:500}
.person-card .role{font-size:11px;color:var(--text3)}

/* Editor */
.editor{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px}
.editor textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:var(--font);padding:12px;resize:vertical;min-height:200px;outline:none;line-height:1.7}
.editor textarea:focus{border-color:var(--accent)}
.editor-toolbar{display:flex;gap:8px;margin-bottom:8px}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-head{font-size:10px;color:var(--text3);text-align:center;padding:4px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:12px;cursor:pointer;transition:all .15s;color:var(--text2)}
.cal-day:hover{background:var(--bg3)}
.cal-day.today{background:var(--accent);color:#fff;font-weight:600}
.cal-day.has-entry{background:var(--bg3);color:var(--accent)}
.cal-day.other{color:var(--text3);opacity:.4}

/* Retreat */
.retreat-section{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.retreat-section h3{font-size:14px;font-weight:600;margin-bottom:8px}
.wheel-input{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wheel-input label{flex:1;font-size:12px;color:var(--text2)}
.wheel-input input[type=range]{flex:2;accent-color:var(--accent)}
.wheel-input .val{width:30px;text-align:center;font-size:13px;font-weight:600;color:var(--accent)}

/* Tab bar */
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:8px}
.tab{padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--text3);transition:all .15s}
.tab:hover{color:var(--text2);background:var(--bg3)}
.tab.active{color:var(--accent);background:var(--bg3)}

/* Quick links */
.qlinks{display:flex;flex-wrap:wrap;gap:8px}
.qlink{padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.qlink:hover{border-color:var(--accent);color:var(--accent)}

/* Chat */
.chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.msgs{flex:1;overflow-y:auto;min-height:0}
.msg{display:flex;gap:10px;padding:12px 16px;max-width:800px;margin:0 auto;width:100%}
.msg.user{justify-content:flex-end}
.msg.user .bb{background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px}
.msg.ai .bb{background:transparent;border-radius:16px 16px 16px 4px}
.msg .bb{padding:12px 16px;font-size:13px;line-height:1.7;max-width:75%;white-space:pre-wrap;word-wrap:break-word}
.msg .av{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.ai .av{background:var(--accent3);color:#fff}
.msg.user .av{background:var(--bg4);color:var(--text)}
.input-area{padding:12px 16px 20px;background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}
.input-wrap{max-width:800px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.input-wrap textarea{flex:1;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:var(--font);outline:none;resize:none;min-height:42px;max-height:120px;line-height:1.5;transition:border-color .15s}
.input-wrap textarea:focus{border-color:var(--accent)}
.send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.send-btn:hover{background:var(--accent2)}
.typing{display:flex;gap:4px;padding:6px 10px}
.typing span{width:5px;height:5px;background:var(--text3);border-radius:50%;animation:bounce 1.4s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* Mobile */
.menu-btn{display:none;position:fixed;top:10px;left:10px;z-index:101;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);cursor:pointer;font-size:16px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
@media(max-width:768px){
.sb{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%)}
.sb.open{transform:translateX(0)}
.overlay.show{display:block}
.menu-btn{display:flex!important}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<button class="menu-btn" onclick="toggleSidebar()"><i class="fi fi-rr-menu-burger"></i></button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sb" id="sidebar">
<div class="sb-h">
<div class="logo">
<div class="logo-icon"><i class="fi fi-rr-compass" style="color:#fff;font-size:16px"></i></div>
<span>Life OS</span>
</div>
</div>
<nav class="nav">
<div class="nav-label">Dashboard</div>
<div class="ni a" id="n-dashboard" onclick="show('dashboard')"><i class="fi fi-rr-compass"></i> Compass</div>
<div class="ni" id="n-journal" onclick="show('journal')"><i class="fi fi-rr-notebook"></i> Journal</div>
<div class="ni" id="n-retreat" onclick="show('retreat')"><i class="fi fi-rr-mountain"></i> Retreat</div>
<div class="nav-label">Plan</div>
<div class="ni" id="n-planning" onclick="show('planning')"><i class="fi fi-rr-bullseye"></i> Planning</div>
<div class="ni" id="n-projects" onclick="show('projects')"><i class="fi fi-rr-kanban"></i> Projects</div>
<div class="ni" id="n-tasks" onclick="show('tasks')"><i class="fi fi-rr-checkbox"></i> Tasks</div>
<div class="nav-label">Knowledge</div>
<div class="ni" id="n-wiki" onclick="show('wiki')"><i class="fi fi-rr-book-open-reader"></i> Wiki</div>
<div class="ni" id="n-sources" onclick="show('wiki','sources')"><i class="fi fi-rr-document"></i> Sources</div>
<div class="ni" id="n-entities" onclick="show('wiki','entities')"><i class="fi fi-rr-user"></i> Entities</div>
<div class="ni" id="n-concepts" onclick="show('wiki','concepts')"><i class="fi fi-rr-bulb"></i> Concepts</div>
<div class="nav-label">People & Content</div>
<div class="ni" id="n-people" onclick="show('people')"><i class="fi fi-rr-users"></i> People</div>
<div class="ni" id="n-writing" onclick="show('writing')"><i class="fi fi-rr-pen"></i> Writing</div>
<div class="ni" id="n-library" onclick="show('library')"><i class="fi fi-rr-book-open"></i> Library</div>
<div class="nav-label">Tools</div>
<div class="ni" id="n-chat" onclick="show('chat')"><i class="fi fi-rr-comment"></i> AI Chat</div>
<div class="ni" id="n-graph" onclick="show('graph')"><i class="fi fi-rr-diagram-project"></i> Graph</div>
<div class="ni" onclick="location.href='terminal.html'"><i class="fi fi-rr-terminal"></i> Terminal</div>
</nav>
<div class="user-card">
<div class="user-avatar"><i class="fi fi-rr-user" style="font-size:14px"></i></div>
<div><div class="user-name">Subash</div><div class="user-plan">Life OS</div></div>
</div>
</aside>
<main class="mn">
<div class="hd">
<div class="sb-wrap"><i class="fi fi-rr-search"></i><input type="text" id="search" placeholder="Search..." onkeyup="if(event.key==='Enter')doSearch()"></div>
</div>
<div class="ct" id="ct"></div>
</main>
</div>

<script>
// ============================================================
// GITHUB DATA
// ============================================================
const GH_API='/api/github';
const ghCache={};
async function ghDir(path){if(ghCache[path])return ghCache[path];try{const r=await fetch(GH_API+'?path='+encodeURIComponent(path));if(!r.ok)return[];const d=await r.json();if(!Array.isArray(d))return[];ghCache[path]=d.filter(f=>f.name.endsWith('.md')).map(f=>({name:f.name.replace('.md',''),path:f.path,size:f.size}));return ghCache[path];}catch(e){console.error('ghDir error:',e);return[];}}
async function ghFile(path){const k='f:'+path;if(ghCache[k])return ghCache[k];try{const r=await fetch(GH_API+'?path='+encodeURIComponent(path));if(!r.ok){console.error('ghFile HTTP',r.status,path);return'';}const d=await r.json();if(d.content){const b64=d.content.replace(/\n/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const text=new TextDecoder('utf-8').decode(bytes);ghCache[k]=text;return text;}}catch(e){console.error('ghFile error:',e,path);}return'';}

// ============================================================
// DATA LAYER
// ============================================================
const STORE={
get(k,d){try{const v=localStorage.getItem('los_'+k);return v?JSON.parse(v):d}catch(e){return d}},
set(k,v){try{localStorage.setItem('los_'+k,JSON.stringify(v))}catch(e){}},
};
const CFG=STORE.get('config',{
questions:[
{k:'dq_goals',text:'Did I do my best to set clear goals today?'},
{k:'dq_progress',text:'Did I do my best to make progress toward my goals?'},
{k:'dq_meaning',text:'Did I do my best to find meaning?'},
{k:'dq_happy',text:'Did I do my best to be happy?'},
{k:'dq_relationships',text:'Did I do my best to build positive relationships?'},
{k:'dq_engaged',text:'Did I do my best to be fully engaged?'},
{k:'dq_create',text:'Did I do my best to create something?'},
{k:'dq_learn',text:'Did I do my best to learn something?'}
],
habits:['journal','exercise','reading','meditation','code'],
wheel:['health','relationships','family','career','finances','growth','fun','meaning'],
theme:'Build AI-powered systems that create freedom, share knowledge through content, and help others build their second brains.',
values:['Build in public','Systems over willpower','Compound knowledge','Freedom','Help others'],
roles:['Creator','Developer','Friend','Family member','Learner','Community member'],
birthdate:'2000-01-01',
lifeExpectancy:80
});
function saveCfg(){STORE.set('config',CFG)}
function today(){return new Date().toISOString().slice(0,10)}
function weekKey(d){const dt=new Date(d);constjan7=new Date(dt.getFullYear(),0,7);const day=dt.getDay()||7;dt.setDate(dt.getDate()+4-day);const weekNum=Math.ceil(((dt-new Date(dt.getFullYear(),0,7))/864e5+1)/7);return dt.getFullYear()+'-W'+String(weekNum).padStart(2,'0')}
function quarterKey(d){return d.slice(0,4)+'-Q'+Math.ceil((parseInt(d.slice(5,7)))/3)}
function dayOfWeek(d){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d).getDay()]}

// ============================================================
// JOURNAL DATA
// ============================================================
function getJournal(date){return STORE.get('journal_'+date,{date,questions:{},habits:{},wins:'',gratitude:'',journal:'',entries:[]})}
function saveJournal(date,data){STORE.set('journal_'+date,data)}

function drawWheel(id,data,labels){
const cv=document.getElementById(id);if(!cv)return;
const ctx=cv.getContext('2d');
const cx=130,cy=130,r=100;
const n=labels.length;
ctx.clearRect(0,0,260,260);

// Draw rings
for(let ring=1;ring<=5;ring++){
ctx.beginPath();
const rr=r*ring/5;
for(let i=0;i<=n;i++){
const a=(i/n)*Math.PI*2-Math.PI/2;
const x=cx+Math.cos(a)*rr;
const y=cy+Math.sin(a)*rr;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.strokeStyle='rgba(255,255,255,.08)';
ctx.lineWidth=1;
ctx.stroke();
}

// Draw axes
for(let i=0;i<n;i++){
const a=(i/n)*Math.PI*2-Math.PI/2;
ctx.beginPath();
ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
ctx.strokeStyle='rgba(255,255,255,.06)';
ctx.stroke();
}

// Draw data
const vals=labels.map(l=>data[l]||0);
if(vals.some(v=>v>0)){
ctx.beginPath();
for(let i=0;i<=n;i++){
const idx=i%n;
const a=(idx/n)*Math.PI*2-Math.PI/2;
const v=vals[idx]/10*r;
const x=cx+Math.cos(a)*v;
const y=cy+Math.sin(a)*v;
i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
}
ctx.fillStyle='rgba(77,124,254,.2)';
ctx.fill();
ctx.strokeStyle='rgba(77,124,254,.8)';
ctx.lineWidth=2;
ctx.stroke();

// Draw dots
for(let i=0;i<n;i++){
const a=(i/n)*Math.PI*2-Math.PI/2;
const v=vals[i]/10*r;
ctx.beginPath();
ctx.arc(cx+Math.cos(a)*v,cy+Math.sin(a)*v,4,0,Math.PI*2);
ctx.fillStyle='#4d7cfe';
ctx.fill();
ctx.strokeStyle='#fff';
ctx.lineWidth=1.5;
ctx.stroke();
}
}

// Draw labels
ctx.font='10px Inter,system-ui,sans-serif';
ctx.fillStyle='#8899b8';
ctx.textAlign='center';
for(let i=0;i<n;i++){
const a=(i/n)*Math.PI*2-Math.PI/2;
const x=cx+Math.cos(a)*(r+18);
const y=cy+Math.sin(a)*(r+18)+3;
ctx.fillText(labels[i],x,y);
}
}

function drawQuestionChart(id,days){
const el=document.getElementById(id);if(!el)return;
const colors=['#4d7cfe','#6b95ff','#3a5fd4','#a78bfa','#22c55e','#f59e0b','#f472b6','#ef4444'];
let html='<div class="dq-bar">';
for(let i=days-1;i>=0;i--){
const d=new Date();d.setDate(d.getDate()-i);
const dj=getJournal(d.toISOString().slice(0,10));
const vals=Object.values(dj.questions).filter(v=>v>0);
const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
const h=Math.max(2,avg*10);
html+=`<div class="dq-col"><div style="font-size:9px;color:var(--text3)">${avg?avg.toFixed(1):'-'}</div><div class="bar" style="height:${h}px;background:${colors[i%colors.length]}"></div><div style="font-size:9px;color:var(--text3)">${dayOfWeek(d.toISOString().slice(0,10))}</div></div>`;
}
html+='</div>';
el.innerHTML=html;
}

function drawHabitCanvas(id,days){
const el=document.getElementById(id);if(!el)return;
const habits=CFG.habits;
const colors=['#4d7cfe','#22c55e','#f59e0b','#a78bfa','#f472b6'];
let html=`<div class="habit-labels">`;
for(let i=days-1;i>=0;i-=5){
const d=new Date();d.setDate(d.getDate()-i);
html+=`<span style="flex:${5}">${d.toISOString().slice(5,10)}</span>`;
}
html+=`</div>`;
for(let hi=0;hi<habits.length;hi++){
html+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px"><span style="font-size:10px;color:var(--text3);width:70px;text-align:right">${habits[hi]}</span><div style="display:flex;gap:2px;flex:1">`;
for(let i=days-1;i>=0;i--){
const d=new Date();d.setDate(d.getDate()-i);
const dj=getJournal(d.toISOString().slice(0,10));
const done=dj.habits[habits[hi]]?1:0;
html+=`<div class="habit-cell ${done?'l4':'l0'}" style="flex:1" onclick="toggleHabit('${d.toISOString().slice(0,10)}','${habits[hi]}')" title="${d.toISOString().slice(0,10)}"></div>`;
}
html+=`</div></div>`;
}
el.innerHTML=html;
}

function toggleHabit(date,habit){
const j=getJournal(date);
j.habits[habit]=!j.habits[habit];
saveJournal(date,j);
show('dashboard');
}

function toggleHabitCheck(date,habit,val){const j=getJournal(date);j.habits[habit]=val;saveJournal(date,j);show('journal');}
function saveJField(date,field,val){const j=getJournal(date);j[field]=val;saveJournal(date,j);}

function renderJournalInline(date,j){
let html=`<div class="date" style="font-size:11px;color:var(--text3);margin-bottom:8px">${date} · ${dayOfWeek(date)}</div>`;
html+=`<div class="h-check" style="margin-bottom:8px">`;
CFG.habits.forEach(h=>{
html+=`<label><input type="checkbox" ${j.habits[h]?'checked':''} onchange="toggleHabitCheck('${date}','${h}',this.checked)"><span>${h}</span></label>`;
});
html+=`</div>`;
if(j.wins)html+=`<div style="font-size:12px;color:var(--green);margin-bottom:4px">Wins: ${esc(j.wins.slice(0,100))}</div>`;
if(j.gratitude)html+=`<div style="font-size:12px;color:var(--yellow);margin-bottom:4px">Gratitude: ${esc(j.gratitude.slice(0,100))}</div>`;
if(!j.journal&&!j.wins&&!j.gratitude)html+=`<div style="font-size:12px;color:var(--text3)">No entry yet. Click Journal to write.</div>`;
return html;
}

async function send(){
if(busy)return;
const m=document.getElementById('cin').value.trim();
if(!m)return;
const box=document.getElementById('msgs');if(!box)return;
const w=document.getElementById('welcome');if(w)w.remove();
box.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="av"><i class="fi fi-rr-user" style="font-size:12px"></i></div><div class="bb">${esc(m)}</div></div>`);
box.insertAdjacentHTML('beforeend',`<div class="msg ai" id="typing"><div class="av">🧠</div><div class="bb"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
box.scrollTop=box.scrollHeight;
document.getElementById('cin').value='';document.getElementById('cin').style.height='auto';
busy=true;document.getElementById('sbn').disabled=true;
chatHist.push({role:'user',content:m});

try{
const ctx=await buildContext(m);
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history:chatHist.slice(-6),context:ctx})});
const d=await r.json();
document.getElementById('typing')?.remove();
box.insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="av">🧠</div><div class="bb">${renderMd(d.response||'No reply.')}</div></div>`);
chatHist.push({role:'assistant',content:d.response||''});
}catch(e){
document.getElementById('typing')?.remove();
box.insertAdjacentHTML('beforeend',`<div class="msg ai"><div class="av">🧠</div><div class="bb" style="color:var(--red)">Error: ${e.message}</div></div>`);
}
busy=false;document.getElementById('sbn').disabled=false;box.scrollTop=box.scrollHeight;
}

async function buildContext(q){
const parts=[];
const t=today();

// Today's journal
const j=getJournal(t);
parts.push(`=== TODAY'S JOURNAL (${t}) ===\nQuestions: ${JSON.stringify(j.questions)}\nHabits: ${JSON.stringify(j.habits)}\nJournal: ${j.journal||'(empty)'}\nWins: ${j.wins||'(empty)'}\nGratitude: ${j.gratitude||'(empty)'}`);

// Config
parts.push(`=== LIFE OS CONFIG ===\nTheme: ${CFG.theme}\nValues: ${CFG.values.join(', ')}\nRoles: ${CFG.roles.join(', ')}\nHabits: ${CFG.habits.join(', ')}\nQuestions: ${CFG.questions.map(q=>q.text).join('; ')}`);

// Tasks
const tasks=getTasks();
if(tasks.length)parts.push(`=== TASKS ===\n${tasks.map(t=>`${t.done?'[x]':'[ ]'} ${t.text}`).join('\n')}`);

// Projects
const projects=getProjects();
if(projects.length)parts.push(`=== PROJECTS ===\n${projects.map(p=>`[${p.status}] ${p.title}: ${p.desc||''}`).join('\n')}`);

// Recent journal entries
parts.push(`=== RECENT JOURNAL (7 days) ===`);
for(let i=1;i<=7;i++){
const d=new Date();d.setDate(d.getDate()-i);
const dj=getJournal(d.toISOString().slice(0,10));
if(dj.journal||dj.wins)parts.push(`${d.toISOString().slice(0,10)}: ${dj.journal||''} ${dj.wins?'Wins: '+dj.wins:''}`);
}

// Retreat
const qk=quarterKey(t);
const retreat=getRetreat(qk);
parts.push(`=== QUARTERLY RETREAT (${qk}) ===\nWheel: ${JSON.stringify(retreat.wheel)}\nFocus: ${retreat.focus||'(none)'}\nIntentions: ${retreat.intentions.join(', ')}`);

// People
const people=getPeople();
if(people.length)parts.push(`=== PEOPLE ===\n${people.map(p=>`${p.name} (${p.role||''}): ${p.notes||''}`).join('\n')}`);

// Wiki data from GitHub
try{
const sources=await ghDir('wiki/sources');
const entities=await ghDir('wiki/entities');
const concepts=await ghDir('wiki/concepts');
parts.push(`=== KNOWLEDGE BASE ===\nSources: ${sources.map(s=>s.name).join(', ')}\nEntities: ${entities.map(e=>e.name).join(', ')}\nConcepts: ${concepts.map(c=>c.name).join(', ')}`);

// Load a few source summaries for context
for(const s of sources.slice(0,3)){
const c=await ghFile('wiki/sources/'+s.name+'.md');
if(c)parts.push(`=== ${s.name} ===\n${c.slice(0,1500)}`);
}
}catch(e){}

return parts.join('\n\n');
}

function renderGraph(ct){
ct.innerHTML=`
<div style="padding:20px;max-width:900px;margin:0 auto;width:100%">
<h2 style="font-size:18px;font-weight:600;margin-bottom:16px">Graph</h2>
<p style="color:var(--text3);font-size:13px;margin-bottom:16px">Visual connections between your journal entries, tasks, projects, and people.</p>
<canvas id="gc" style="width:100%;height:400px;background:radial-gradient(ellipse at center,#14141c 0%,#0a0a0f 75%);border:1px solid var(--border);border-radius:10px;cursor:grab;touch-action:none"></canvas>
</div>`;
buildSimpleGraph();
}

function buildSimpleGraph(){
const cv=document.getElementById('gc');if(!cv)return;
const ctx=cv.getContext('2d');
const d=window.devicePixelRatio||1;
cv.width=cv.clientWidth*d;cv.height=400*d;
ctx.setTransform(d,0,0,d,0,0);

const w=cv.clientWidth,h=400;
const nodes=[];

// Add journal entries
for(let i=6;i>=0;i--){
const d=new Date();d.setDate(d.getDate()-i);
const ds=d.toISOString().slice(0,10);
const j=getJournal(ds);
nodes.push({x:100+i*100,y:100+Math.random()*60,r:8,color:'#4d7cfe',label:ds.slice(5)});
}

// Add tasks
const tasks=getTasks().slice(0,5);
tasks.forEach((t,i)=>{
nodes.push({x:100+i*120,y:250+Math.random()*40,r:6,color:'#22c55e',label:t.text.slice(0,15)});
});

// Add people
const people=getPeople().slice(0,3);
people.forEach((p,i)=>{
nodes.push({x:150+i*150,y:350,r:7,color:'#f472b6',label:p.name});
});

// Draw edges
ctx.strokeStyle='rgba(148,163,255,.2)';
ctx.lineWidth=1;
for(let i=0;i<nodes.length-1;i++){
ctx.beginPath();
ctx.moveTo(nodes[i].x,nodes[i].y);
ctx.lineTo(nodes[i+1].x,nodes[i+1].y);
ctx.stroke();
}

// Draw nodes
nodes.forEach(n=>{
ctx.beginPath();
ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
ctx.fillStyle=n.color;
ctx.fill();
ctx.strokeStyle='rgba(255,255,255,.3)';
ctx.lineWidth=1;
ctx.stroke();
ctx.fillStyle='#8899b8';
ctx.font='10px Inter,system-ui,sans-serif';
ctx.fillText(n.label,n.x+n.r+4,n.y+3);
});
}

<div class="panel" style="max-width:700px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
<button class="btn-ghost btn-sm" onclick="show('wiki','${cat}')"><i class="fi fi-rr-arrow-left"></i> Back</button>
<h2 style="margin:0;font-size:16px">${esc(name.replace(/[-_]/g,' '))}</h2>
</div>
<p style="color:var(--red)">Failed to load content. <a href="https://github.com/Gongwasubash/ai/blob/main/${cat}/${name}.md" target="_blank" style="color:var(--accent)">View on GitHub</a></p>
</div>`;
return;
}
ct.innerHTML=`
<div class="panel" style="max-width:700px">
<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
<button class="btn-ghost btn-sm" onclick="show('wiki','${cat}')"><i class="fi fi-rr-arrow-left"></i> Back</button>
<h2 style="margin:0;font-size:16px">${esc(name.replace(/[-_]/g,' '))}</h2>
</div>
<div style="font-size:11px;color:var(--text3);margin-bottom:8px">${cat}</div>
<div style="line-height:1.8;font-size:13px;white-space:pre-wrap">${renderMd(content.slice(0,15000))}</div>
</div>`;
}

// ============================================================
// SEARCH
// ============================================================
function doSearch(){
const q=document.getElementById('search').value.trim().toLowerCase();
if(!q)return;
const results=[];
// Search tasks
getTasks().forEach((t,i)=>{if(t.text.toLowerCase().includes(q))results.push({type:'task',text:t.text,view:'tasks'})});
// Search people
getPeople().forEach((p,i)=>{if(p.name.toLowerCase().includes(q)||p.notes?.toLowerCase().includes(q))results.push({type:'person',text:p.name,view:'people'})});
// Search projects
getProjects().forEach((p,i)=>{if(p.title.toLowerCase().includes(q))results.push({type:'project',text:p.title,view:'projects'})});

const ct=document.getElementById('ct');
ct.innerHTML=`
<div class="panel">
<h2>Results for "${esc(q)}"</h2>
${results.length?results.map(r=>`
<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="show('${r.view}')">
<div style="font-size:11px;color:var(--text3);text-transform:uppercase">${r.type}</div>
<div style="font-size:13px">${esc(r.text)}</div>
</div>
`).join(''):'<p style="color:var(--text3)">No results found.</p>'}
</div>`;
}

// ============================================================
// UTILS
// ============================================================
function esc(t){const d=document.createElement('div');d.textContent=t||'';return d.innerHTML;}
function renderMd(t){if(!t)return'';return t.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre style="background:var(--bg3);padding:10px;border-radius:6px;overflow-x:auto;font-size:11px"><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code style="background:var(--bg3);padding:2px 5px;border-radius:3px;font-size:11px">$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>');}

// ============================================================
// INIT
// ============================================================
show('dashboard');
</script>
</body>
</html>
